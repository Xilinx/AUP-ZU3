[Service]
ExecStopPost=/bin/sh -ec 'if [ -e /sys/kernel/config/usb_gadget/g/functions/mass_storage.ms0/lun.0/file ]; then test -z "$(cat /sys/kernel/config/usb_gadget/g/UDC)"; echo > /sys/kernel/config/usb_gadget/g/functions/mass_storage.ms0/lun.0/file; fi'
